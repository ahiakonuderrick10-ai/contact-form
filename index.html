<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-decoration decoration-left"></div>
  <div class="background-decoration decoration-right"></div>

  <main class="page">
    <section class="contact-card">

      <h1>Contact Us</h1>

      <form id="contactForm">

        <div class="name-row">
          <div class="form-group">
            <label for="firstName">
              First Name <span>*</span>
            </label>
            <input type="text" id="firstName" name="firstName">
            <small class="error"></small>
          </div>

          <div class="form-group">
            <label for="lastName">
              Last Name <span>*</span>
            </label>
            <input type="text" id="lastName" name="lastName">
            <small class="error"></small>
          </div>
        </div>

        <div class="form-group">
          <label for="email">
            Email Address <span>*</span>
          </label>
          <input type="email" id="email" name="email">
          <small class="error"></small>
        </div>

        <div class="form-group">
          <label>Query Type <span>*</span></label>

          <div class="query-row">

            <label class="radio-box">
              <input type="radio" name="queryType" value="General Enquiry">
              <span>General Enquiry</span>
            </label>

            <label class="radio-box">
              <input type="radio" name="queryType" value="Support Request">
              <span>Support Request</span>
            </label>

          </div>

          <small class="error" id="queryError"></small>
        </div>

        <div class="form-group">
          <label for="message">
            Message <span>*</span>
          </label>
          <textarea id="message" name="message"></textarea>
          <small class="error"></small>
        </div>

        <label class="consent">
          <input type="checkbox" id="consent">
          <span>I consent to being contacted by the team <b>*</b></span>
        </label>

        <small class="error" id="consentError"></small>

        <button type="submit">Submit</button>

        <div id="successMessage" class="success-message">
          Message sent successfully!
        </div>

      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
